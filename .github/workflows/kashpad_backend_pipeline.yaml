name: Kashpad Backend CI/CD Pipeline

on:
  push:
    branches:  
      - main
      - develop
      - 'release/*'
    paths:
      - 'Kashpad-Backend/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/*'
    paths:
      - 'Kashpad-Backend/**'

jobs:
  build-test:
    name: Build & Test Maven
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: Kashpad-Backend

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6
      
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven
      
      - name: Build & Test
        run: mvn -B -fae test

  package:
    name: Package Maven
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    defaults:
      run:
        working-directory: Kashpad-Backend

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6
      
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven
      
      - name: Package
        run: mvn -B -fae clean package -Dmaven.test.skip=true

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Kashpad_Backend_JAR
          path: Kashpad-Backend/target/*.jar

  build-docker-img:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: Kashpad_Backend_JAR
          path: Kashpad-Backend/target

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./Kashpad-Backend
          platforms: linux/amd64
          push: true
          target: final
          tags: ${{ vars.DOCKER_USERNAME }}/kashpad-backend:latest